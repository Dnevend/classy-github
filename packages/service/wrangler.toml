#:schema node_modules/wrangler/config-schema.json
# wrangler.toml — GitHub API 代理
#
# 说明：原 `routes` 里配置的是 `api.classygit.me` 自定义域名，
# 该域名已失效（NXDOMAIN），保留会导致 `wrangler deploy` 直接失败。
# 现在改用 workers.dev 默认域名：https://classy-api.dnevend.workers.dev

name = "classy-api"
main = "src/index.ts"
compatibility_date = "2023-12-01"
workers_dev = true

# 域名恢复后，取消下面这段注释即可重新挂自定义域（同时要把
# packages/shared/constants/index.tsx 里的 proxyApi 改回去）
# routes = [
# 	{ pattern = "api.classygit.me", custom_domain = true }
# ]
